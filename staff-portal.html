<style>
:root{--paper:#eef3ff;--gold:#f47b20;--deep:#1338be;--muted:#5b6474;--line:#e6e8ee}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:var(--paper);color:#0e1116;line-height:1.6}
header{background:#fff;border-bottom:1px solid var(--line)}
.nav{max-width:1080px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:70px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;text-transform:uppercase;color:var(--deep);text-decoration:none}
.logo img{height:46px;width:46px;border-radius:50%;object-fit:cover}.logo b{color:var(--gold)}
.back{font-size:13px;font-weight:700;text-transform:uppercase;color:var(--muted);text-decoration:none}
h1{font-family:Georgia,serif;font-size:44px;text-align:center;padding:40px 20px 20px;color:var(--deep)}
.box{max-width:380px;margin:0 auto 60px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 8px 22px rgba(19,56,190,.10)}
.box label{font-weight:700;font-size:14px}.box input{width:100%;padding:12px;margin:8px 0 14px;border:1px solid #cfd6e6;border-radius:8px;font-size:16px}
.box button{width:100%;padding:12px;background:var(--deep);color:#fff;border:0;border-radius:8px;font-weight:800;font-size:15px;cursor:pointer}
.box button:hover{background:var(--gold)}.err{color:#c62828;font-size:14px;margin-top:10px;min-height:20px}
#portal{max-width:860px;margin:0 auto 60px;padding:0 20px;display:none}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 26px;margin-bottom:18px}
.card h2{font-family:Georgia,serif;color:var(--deep);margin-bottom:10px;border-bottom:3px solid var(--gold);display:inline-block}
.card ul{padding-left:20px}table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--deep)}
.card a{color:var(--deep);font-weight:700}
.logout{display:block;margin:0 auto;padding:10px 22px;background:#fff;border:2px solid var(--deep);color:var(--deep);border-radius:8px;font-weight:800;cursor:pointer}
footer{background:var(--deep);color:#c9d3ff;text-align:center;padding:30px 24px;font-size:13px}
</style></head><body>

const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(E.s),iterations:250000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['decrypt']);
const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(E.i)},k,d(E.c));return new TextDecoder().decode(p);}

document.getElementById('f').addEventListener('submit',async ev=>{ev.preventDefault();const pw=document.getElementById('pw').value;document.getElementById('err').textContent='Checking...';
try{show(await unlock(pw));sessionStorage.setItem('cafs_staff',pw);}catch(x){document.getElementById('err').textContent='Wrong password. Try again.';}});
document.getElementById('out').addEventListener('click',()=>{sessionStorage.removeItem('cafs_staff');location.reload();});
const saved=sessionStorage.getItem('cafs_staff');if(saved)unlock(saved).then(show).catch(()=>sessionStorage.removeItem('cafs_staff'));
