<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Portal | Children Are Future Successors</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/images/logo.png">
<style>
:root{--paper:#eef3ff;--gold:#f47b20;--deep:#1338be;--muted:#5b6474;--line:#e6e8ee}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:var(--paper);color:#0e1116;line-height:1.6}
header{background:#fff;border-bottom:1px solid var(--line)}
.nav{max-width:1080px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:70px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;text-transform:uppercase;color:var(--deep);text-decoration:none}
.logo img{height:46px;width:46px;border-radius:50%;object-fit:cover}.logo b{color:var(--gold)}
.back{font-size:13px;font-weight:700;text-transform:uppercase;color:var(--muted);text-decoration:none}
h1{font-family:Georgia,serif;font-size:42px;text-align:center;padding:36px 20px 18px;color:var(--deep)}
.box{max-width:400px;margin:0 auto 60px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 8px 22px rgba(19,56,190,.10)}
label{font-weight:700;font-size:14px;display:block}
input,textarea{width:100%;padding:11px;margin:6px 0 14px;border:1px solid #cfd6e6;border-radius:8px;font-size:16px;font-family:inherit}
textarea{min-height:70px}
.btn{display:inline-block;padding:11px 20px;background:var(--deep);color:#fff;border:0;border-radius:8px;font-weight:800;font-size:15px;cursor:pointer}
.btn:hover{background:var(--gold)}.btn.full{width:100%}
.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--deep)}
.btn.red{background:#c62828}.btn.small{padding:6px 12px;font-size:13px}
.msg{font-size:14px;margin-top:10px;min-height:20px;color:var(--muted)}.msg.err{color:#c62828}
.link{background:none;border:0;color:var(--deep);font-weight:700;cursor:pointer;margin-top:12px;font-size:14px}
#app{max-width:900px;margin:0 auto 60px;padding:0 20px;display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:20px}
.card h2{font-family:Georgia,serif;color:var(--deep);margin-bottom:14px;border-bottom:3px solid var(--gold);display:inline-block}
.row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 0}
.row b{color:var(--deep)}.row small{color:var(--muted);display:block}
.acts{display:flex;gap:6px;flex-shrink:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.pgrid figure{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fafbff}
.pgrid img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.pgrid figcaption{padding:6px 8px;font-size:12px;color:var(--muted)}
.pgrid .btn{width:100%;border-radius:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.two{grid-template-columns:1fr}h1{font-size:34px}}
footer{background:var(--deep);color:#c9d3ff;text-align:center;padding:30px 24px;font-size:13px}
</style></head><body>
<header><div class="nav"><a class="logo" href="index.html"><img src="images/logo.png" alt="Logo"><span>Children Are <b>Future Successors</b></span></a><a class="back" href="index.html">&larr; Home</a></div></header>
<h1>Staff Portal</h1>

<div class="box" id="loginBox">
  <form id="loginForm">
    <label for="email">Email</label><input type="email" id="email" autocomplete="username" required>
    <label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" required>
    <button class="btn full" type="submit">Log In</button>
    <div class="msg" id="loginMsg"></div>
  </form>
  <button class="link" id="forgot">Forgot password?</button>
</div>

<div class="box" id="resetBox" style="display:none">
  <form id="resetForm">
    <label for="newpw">Set a new password</label><input type="password" id="newpw" minlength="8" autocomplete="new-password" required>
    <button class="btn full" type="submit">Save Password</button>
    <div class="msg" id="resetMsg"></div>
  </form>
</div>

<div id="app">
  <div class="top"><div>Logged in as <b id="who"></b></div><button class="btn ghost small" id="logout">Log Out</button></div>

  <div class="card">
    <h2>Events</h2>
    <form id="evForm">
      <input type="hidden" id="evId">
      <label for="evTitle">Event name</label><input id="evTitle" required>
      <div class="two">
        <div><label for="evWhen">When (what visitors see)</label><input id="evWhen" placeholder="Sat, Nov 21 - 2:00 PM"></div>
        <div><label for="evDate">Date (for ordering)</label><input id="evDate" type="date"></div>
      </div>
      <label for="evDetails">Details (optional)</label><textarea id="evDetails"></textarea>
      <button class="btn" type="submit" id="evSave">Add Event</button>
      <button class="btn ghost" type="button" id="evCancel" style="display:none">Cancel</button>
      <div class="msg" id="evMsg"></div>
    </form>
    <div id="evList"></div>
  </div>

  <div class="card">
    <h2>Photo Gallery</h2>
    <form id="phForm">
      <label for="phFiles">Add photos</label><input type="file" id="phFiles" accept="image/*" multiple required>
      <label for="phCap">Caption (optional)</label><input id="phCap">
      <button class="btn" type="submit">Upload</button>
      <div class="msg" id="phMsg"></div>
    </form>
    <div class="pgrid" id="phList"></div>
  </div>
</div>

<footer>&copy; 2026 Children Are Future Successors &middot; Staff only</footer>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient('https://dojnpcaehdyxtlmmeiff.supabase.co','sb_publishable_2vb4cfQllwG-bfBJDYUqXg_oAh1AWVk');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say = (id, t, err) => { $(id).textContent = t; $(id).className = 'msg' + (err ? ' err' : ''); };

function showApp(user){ $('loginBox').style.display='none'; $('resetBox').style.display='none'; $('app').style.display='block'; $('who').textContent=user.email; loadEvents(); loadPhotos(); }
function showLogin(){ $('app').style.display='none'; $('resetBox').style.display='none'; $('loginBox').style.display='block'; }

sb.auth.onAuthStateChange((ev, session) => {
  if (ev === 'PASSWORD_RECOVERY') { $('loginBox').style.display='none'; $('app').style.display='none'; $('resetBox').style.display='block'; return; }
  if (session?.user && $('resetBox').style.display !== 'block') showApp(session.user);
  if (ev === 'SIGNED_OUT') showLogin();
});
const { data: { session } } = await sb.auth.getSession();
if (session?.user && !location.hash.includes('type=recovery')) showApp(session.user);

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault(); say('loginMsg','Logging in...');
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pw').value });
  if (error) say('loginMsg','Wrong email or password.', true);
});
$('forgot').addEventListener('click', async () => {
  const email = $('email').value.trim();
  if (!email) return say('loginMsg','Type your email above first, then tap Forgot password.', true);
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/staff-portal.html' });
  say('loginMsg', error ? 'Could not send reset email.' : 'Check your email for a reset link.', !!error);
});
$('resetForm').addEventListener('submit', async e => {
  e.preventDefault();
  const { data, error } = await sb.auth.updateUser({ password: $('newpw').value });
  if (error) return say('resetMsg', error.message, true);
  $('resetBox').style.display='none'; history.replaceState(null,'',location.pathname); showApp(data.user);
});
$('logout').addEventListener('click', () => sb.auth.signOut());

// EVENTS
let events = [];
async function loadEvents(){
  const { data, error } = await sb.from('events').select('*').order('sort_date',{ascending:true,nullsFirst:false}).order('created_at');
  if (error) return $('evList').innerHTML = '<p class="msg err">Could not load events.</p>';
  events = data;
  $('evList').innerHTML = data.length ? data.map(e => `<div class="row"><div><b>${esc(e.title)}</b><small>${esc(e.when_text||'Date TBA')}</small>${e.details?`<small>${esc(e.details)}</small>`:''}</div><div class="acts"><button class="btn ghost small" data-edit="${e.id}">Edit</button><button class="btn red small" data-del="${e.id}">Delete</button></div></div>`).join('') : '<p class="msg">No events yet.</p>';
}
function resetEv(){ $('evForm').reset(); $('evId').value=''; $('evSave').textContent='Add Event'; $('evCancel').style.display='none'; }
$('evCancel').addEventListener('click', resetEv);
$('evList').addEventListener('click', async e => {
  const ed = e.target.dataset.edit, del = e.target.dataset.del;
  if (ed) { const ev = events.find(x => String(x.id) === ed); $('evId').value=ev.id; $('evTitle').value=ev.title; $('evWhen').value=ev.when_text||''; $('evDate').value=ev.sort_date||''; $('evDetails').value=ev.details||''; $('evSave').textContent='Save Changes'; $('evCancel').style.display='inline-block'; $('evTitle').focus(); }
  if (del && confirm('Delete this event?')) { const { error } = await sb.from('events').delete().eq('id', del); say('evMsg', error ? 'Could not delete.' : 'Event deleted.', !!error); loadEvents(); }
});
$('evForm').addEventListener('submit', async e => {
  e.preventDefault();
  const row = { title: $('evTitle').value.trim(), when_text: $('evWhen').value.trim() || null, sort_date: $('evDate').value || null, details: $('evDetails').value.trim() || null };
  const id = $('evId').value;
  const { error } = id ? await sb.from('events').update(row).eq('id', id) : await sb.from('events').insert(row);
  say('evMsg', error ? 'Could not save: ' + error.message : (id ? 'Event updated.' : 'Event added.'), !!error);
  if (!error) { resetEv(); loadEvents(); }
});

// PHOTOS
async function shrink(file){
  try {
    const img = await createImageBitmap(file); const max = 1600; const s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
  } catch { return file; }
}
async function loadPhotos(){
  const { data, error } = await sb.from('photos').select('*').order('created_at',{ascending:false});
  if (error) return $('phList').innerHTML = '<p class="msg err">Could not load photos.</p>';
  $('phList').innerHTML = data.length ? data.map(p => `<figure><img src="${esc(p.url)}" alt="" loading="lazy">${p.caption?`<figcaption>${esc(p.caption)}</figcaption>`:''}<button class="btn red small" data-pid="${p.id}" data-path="${esc(p.path||'')}">Remove</button></figure>`).join('') : '<p class="msg">No uploaded photos yet. The original gallery photos stay on the site.</p>';
}
$('phList').addEventListener('click', async e => {
  const id = e.target.dataset.pid; if (!id || !confirm('Remove this photo from the gallery?')) return;
  const path = e.target.dataset.path; if (path) await sb.storage.from('photos').remove([path]);
  const { error } = await sb.from('photos').delete().eq('id', id);
  say('phMsg', error ? 'Could not remove.' : 'Photo removed.', !!error); loadPhotos();
});
$('phForm').addEventListener('submit', async e => {
  e.preventDefault(); const files = [...$('phFiles').files]; const cap = $('phCap').value.trim() || null; let done = 0;
  for (const f of files) {
    say('phMsg', `Uploading ${done+1} of ${files.length}...`);
    const blob = await shrink(f); const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
    const up = await sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg' });
    if (up.error) { say('phMsg','Upload failed: ' + up.error.message, true); return; }
    const url = sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
    const ins = await sb.from('photos').insert({ url, path, caption: cap });
    if (ins.error) { say('phMsg','Could not save photo: ' + ins.error.message, true); return; }
    done++;
  }
  say('phMsg', `${done} photo${done===1?'':'s'} added.`); $('phForm').reset(); loadPhotos();
});
</script>
</body></html>
